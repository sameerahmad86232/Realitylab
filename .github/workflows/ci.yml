name: Verify app
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npm run build && npm run typecheck && npm test && npm run eval:recorded
      - name: Production private-access smoke test (no provider calls)
        run: npm run test:prod-security
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Browser checks (fixtures; no AI credentials required)
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e "import {chromium} from 'playwright-core'; console.log(chromium.executablePath())")"
          npm start > /tmp/realitylab-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://localhost:3000/api/health > /dev/null && break; sleep 1; done
          failed=0
          for suite in test:followup-ui test:browser test:capture test:server-envelope test:exploration test:blueprint test:learn-ui test:demos test:audit test:resilience test:theater test:project test:trial test:recovery test:devices; do
            npm run "$suite" || failed=1
          done
          exit "$failed"
